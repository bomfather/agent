name: Docker

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-image:
    name: Build Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: bomfather/agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify entrypoint binary is present
        run: |
          set -euo pipefail
          image_ref="bomfather/agent:ci"
          image_id=$(docker images --filter=reference="$image_ref" --format '{{.ID}}')
          if [ -z "$image_id" ]; then
            echo "image $image_ref not found" >&2
            exit 1
          fi
          # distroless/static has no shell; use the image's own /agent entrypoint
          # via `docker inspect` to confirm the config rather than running a shell.
          entrypoint=$(docker inspect --format '{{json .Config.Entrypoint}}' "$image_id")
          echo "entrypoint: $entrypoint"
          echo "$entrypoint" | grep -q '/agent'

  push-image:
    name: Push Docker image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:ci-verify
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify entrypoint binary is present
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY}:ci-verify"
          image_id=$(docker images --filter=reference="$image_ref" --format '{{.ID}}')
          if [ -z "$image_id" ]; then
            echo "image $image_ref not found" >&2
            exit 1
          fi
          entrypoint=$(docker inspect --format '{{json .Config.Entrypoint}}' "$image_id")
          echo "entrypoint: $entrypoint"
          echo "$entrypoint" | grep -q '/agent'

      - name: Push image
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/${GITHUB_REPOSITORY}:ci-verify"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "$source_image" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
