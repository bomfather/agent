name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile and unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build tools
        env:
          CLANG_PKG_VERSION: '1:18.1.3-1ubuntu1'
          LLVM_PKG_VERSION: '1:18.1.3-1ubuntu1'
          PROTOBUF_COMPILER_VERSION: '3.21.12-8.2ubuntu0.3'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-18=${CLANG_PKG_VERSION}" \
            "llvm-18=${LLVM_PKG_VERSION}" \
            "protobuf-compiler=${PROTOBUF_COMPILER_VERSION}"
          test -x /usr/bin/clang-18
          test -x /usr/bin/llvm-objcopy-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy

      - name: Install protoc plugins
        run: make tools

      - name: Build and unit tests
        run: make ci
