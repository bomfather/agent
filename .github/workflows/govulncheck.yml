# Symbol-aware Go vulnerability scan. Replaces Dependabot security PRs for
# gomod; see https://words.filippo.io/dependabot/
name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 10:22 UTC.
    - cron: '22 10 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Generated proto/*.pb.go is gitignored; govulncheck must type-check
      # packages that import it.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          make proto
          # main.go embeds bpf/trace.o; an empty file is enough to type-check.
          test -f bpf/trace.o || touch bpf/trace.o
          CGO_ENABLED=0 govulncheck ./...
