version: 2
updates:
  # Go modules are not managed by Dependabot. Scheduled govulncheck 
  # replace gomod security PRs.
  # See https://words.filippo.io/dependabot/

  # Monitor git submodules (bpf/libbpf)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "libbpf"

  # Monitor GitHub Actions when workflows are added
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
